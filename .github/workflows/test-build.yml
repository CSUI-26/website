name: Build

on:
    pull_request:
        paths:
          - 'src/**'
          - 'public/**'
          - 'astro.config.mts'
          - 'package.json'
          - 'vercel.json'
          - 'bun.lock'

jobs:
    test:
        runs-on: ubuntu-slim
        steps:
            - name: Setup bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

            - name: Checkout
              uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

            - name: Install deps
              run: bun install

            - name: Build project
              run: bun run build
